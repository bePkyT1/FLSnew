<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Учебное приложение</title>
    <style>
      :root {
        --primary: #4f46e5;
        --bg: #f3f4f6;
        --card-bg: #ffffff;
        --text: #111827;
        --success: #10b981;
        --error: #ef4444;
      }
      body {
        font-family: 'Segoe UI', sans-serif;
        padding: 20px;
        margin: 0;
        background-color: var(--bg);
        color: var(--text);
      }

      .page {
        width: 100%;
        margin: 0 auto;
        min-height: 80vh;
        display: none;
        flex-direction: column;
        justify-content: center;
        align-items: center;
      }
      .active {
        display: flex !important;
      }

      header {
        text-align: center;
        width: 100%;
        margin-bottom: 24px;
      }
      h2 {
        margin: 0 0 16px 0;
        font-weight: 600;
        color: var(--primary);
      }
      
      .class-buttons {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
        gap: 12px;
        width: 100%;
      }
      .class-btn {
        padding: 16px;
        border: 1px solid #e5e7eb;
        border-radius: 8px;
        background: var(--card-bg);
        color: var(--text);
        cursor: pointer;
        transition: all 0.2s;
        box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        font-size: 16px;
        font-weight: 500;
      }
      .class-btn:hover {
        transform: translateY(-3px);
        box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        border-color: var(--primary);
      }
      .class-btn.selected {
        background: var(--primary);
        color: white;
        border-color: var(--primary);
        box-shadow: 0 5px 15px rgba(79, 70, 229, 0.3);
      }

      .cards-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
        gap: 16px;
        width: 100%;
      }
      .card {
        background: var(--card-bg);
        border: 1px solid #e5e7eb;
        border-radius: 8px;
        padding: 15px 10px;
        text-align: center;
        cursor: pointer;
        transition: all 0.2s;
        box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        height: 130px;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
      }
      .card:hover {
        transform: translateY(-3px);
        box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        border-color: var(--primary);
      }
      .card-number {
        font-size: 32px;
        font-weight: bold;
        color: var(--primary);
        line-height: 1;
      }
      .card-status {
        margin-top: 4px;
        font-size: 11px;
        color: #6b7280;
      }

      input, textarea {
        width: 100%;
        padding: 14px;
        margin-top: 8px;
        box-sizing: border-box;
        border: 1px solid #e5e7eb;
        border-radius: 8px;
        background: var(--card-bg);
        font-size: 16px;
        outline: none;
      }
      input:focus, textarea:focus {
        border-color: var(--primary);
      }
      label {
        display: block;
        font-weight: 500;
        margin-bottom: 6px;
        color: #374151;
      }

      .question-block {
        margin-bottom: 25px;
        padding: 15px;
        background: #f9fafb;
        border-radius: 8px;
        border-left: 5px solid var(--primary);
        width: 100%;
      }
      .question-text {
        font-weight: 600;
        margin-bottom: 10px;
        display: block;
        font-size: 15px;
      }
      textarea.work-textarea {
        width: 100%;
        min-height: 70px;
        padding: 10px;
        border: 1px solid #e5e7eb;
        border-radius: 8px;
        resize: vertical;
      }
      
      /* Стили для ошибок в полях */
      .has-error textarea { border-color: var(--error); }
      .error-msg {
        color: var(--error);
        font-size: 13px;
        margin-top: 5px;
        display: none;
      }
      .has-error .error-msg { display: block; }

      .timer-container {
        width: 100%;
        max-width: 400px;
        margin: 20px auto;
        border: 1px solid #ddd;
        border-radius: 8px;
        overflow: hidden;
        background: white;
      }
      #timer-fill {
        height: 20px;
        background: var(--primary);
        width: 100%;
        transition: width 1s linear;
      }
      #timer-text {
        text-align: center;
        padding: 8px;
        font-weight: bold;
      }

      .actions {
        margin-top: 30px;
        text-align: center;
      }
      .btn-primary {
        padding: 12px 24px;
        background: var(--primary);
        color: white;
        text-decoration: none;
        border-radius: 6px;
        font-weight: 600;
        cursor: pointer;
        border: none;
        font-size: 16px;
      }
      .btn-primary:disabled {
        background: #ccc;
        cursor: not-allowed;
      }
      .btn-back {
        padding: 10px 20px;
        background: transparent;
        color: #555;
        text-decoration: none;
        border: 1px solid #ccc;
        border-radius: 6px;
        cursor: pointer;
      }

      #result-area {
        margin-top: 30px;
        padding: 20px;
        border-radius: 8px;
        display: none;
        border: 1px solid transparent;
      }
      .result-success { background-color: #d1fae5; color: #065f46; border-color: #10b981; }
      .result-fail { background-color: #fee2e2; color: #991b1b; border-color: #ef4444; }

      #back-to-cards-btn {
        display: none;
        margin-top: 15px;
      }
    </style>
  </head>
  <body>

    <!-- Страница 1: Выбор класса -->
    <div id="page-1" class="page active">
      <header><h2>Выберите класс</h2></header>
      <div class="class-buttons">
        <button class="class-btn" onclick="selectClass(8)">8 класс</button>
        <button class="class-btn" onclick="selectClass(9)">9 класс</button>
        <button class="class-btn" onclick="selectClass(10)">10 класс</button>
        <button class="class-btn" onclick="selectClass(11)">11 класс</button>
      </div>
    </div>

    <!-- Страница 2: Выбор темы -->
    <div id="page-2" class="page">
      <header><h2 id="topic-header">Темы</h2></header>
      <div id="topics-list" class="cards-grid"></div>
      <button class="btn-back" onclick="goBack()">← Назад</button>
    </div>

    <!-- Страница 3: Карточки заданий -->
    <div id="page-3" class="page">
      <header><h2 id="topic-header">Задания по теме</h2></header>
      <div id="cards-container" class="cards-grid"></div>
      <button class="btn-back" onclick="backToTopics()">← К темам</button>
    </div>

    <!-- Страница 4: Регистрация ученика -->
    <div id="page-4" class="page">
      <header><h2>Регистрация</h2></header>
      <div style="width: 100%; max-width: 400px;">
        <label>Фамилия и имя ученика</label>
        <input type="text" id="student-name" placeholder="Иванов Иван" />
        <label>Буква класса</label>
        <input type="text" id="class-letter" placeholder="А" maxlength="2" />
      </div>
      <div class="actions">
        <button class="btn-primary" onclick="startWork()">Начать работу</button>
        <button class="btn-back" onclick="backFromRegistration()">← Назад</button>
      </div>
    </div>

    <!-- Страница 5: Сама работа -->
    <div id="page-5" class="page">
      <header>
        <h2>Выполнение работы</h2>
        <div class="timer-container">
          <div id="timer-fill"></div>
          <div id="timer-text">Осталось времени: 10:00</div>
        </div>
      </header>
      
      <div id="questions-area"></div>
      
      <div class="actions">
        <p id="error-summary" style="color: var(--error); display:none; margin-bottom:10px;">Не заполнены все поля. Проверьте вопросы ниже.</p>
        <button id="submit-btn" class="btn-primary" onclick="submitWork()">Сдать работу</button>
        <button id="sync-btn" class="btn-back" onclick="syncOfflineBuffer()">🔄 Синхронизировать (офлайн‑работы)</button>
        <button id="back-from-questions" class="btn-back" style="display:none;" onclick="backFromQuestions()">← Назад к карточкам</button>
      </div>

      <!-- Блок с результатами проверки -->
      <div id="result-area"></div>
      <button id="back-to-cards-btn" class="btn-back" onclick="returnToCards()">Вернуться к карточкам</button>
    </div>

    <script>

      function generateQuestions() {
  const area = document.getElementById('questions-area');
  if (!area) return;
  area.innerHTML = '';
  const qList = questionsDB[selectedTopic] || [];

  // Перемешиваем и берем 6 вопросов
  const shuffled = [...qList].sort(() => Math.random() - 0.5).slice(0, 6);

  shuffled.forEach((qObj, idx) => {
    const block = document.createElement('div');
    block.className = 'question-block';

    // ВАЖНО: формируем массив правильных ответов, даже если он один
    const correctArray = Array.isArray(qObj.answers) ? qObj.answers : [qObj.a];
    
    // Превращаем массив в строку для data-атрибута
    const dataCorrectString = JSON.stringify(correctArray);

    block.innerHTML = `
      <span class="question-text">${idx + 1}. ${qObj.q}</span>
      <!-- data-correct содержит правильные варианты для проверки -->
      <textarea 
        class="work-textarea" 
        id="q-${idx}" 
        placeholder="Ваш ответ" 
        data-correct='${dataCorrectString}'
      ></textarea>
      <div class="error-msg" id="err-${idx}">Заполните поле</div>
    `;
    area.appendChild(block);
  });
}

function isAnswerCorrect(userAnswer, correct) {
  if (!userAnswer || !userAnswer.trim()) return false;

  const user = userAnswer.trim().toLowerCase();

  // Если correct — строка, сравниваем напрямую
  if (typeof correct === 'string') {
    return user === correct.toLowerCase();
  }

  // Если correct — массив, проверяем наличие совпадения
  if (Array.isArray(correct)) {
    return correct.some(opt => opt.trim().toLowerCase() === user);
  }

  return false;
}

/**
 * Собирает FormData для отправки на Google Apps Script
 * @param {Object} extraData - объект с данными (student, class, topic, score)
 */
function buildFormData(extraData = {}) {
  const formData = new FormData();
  
  // Добавляем основные поля из payload
  formData.append('student', extraData.student || '');
  formData.append('class', extraData.class || '');
  formData.append('topic', extraData.topic || '');
  formData.append('score', extraData.score || '');

  // Если позже захочешь отправлять сами ответы — раскомментируй и допиши логику сбора
  // Сейчас отправляем только итоговый результат, как в твоём коде
  
  return formData;
}

/**
 * Отображает локальный результат ученику (разбор ошибок)
 * @param {number} correct - количество верных ответов
 * @param {number} total - всего вопросов
 * @param {Array} details - массив деталей по каждому вопросу
 */
function renderLocalResult(correct, total, details) {
  const resultArea = document.getElementById('result-area');
  if (!resultArea) return;

  let html = `<h3 style="margin-top:0;">Результат: ${correct} из ${total}</h3>`;

  const errors = details.filter(item => item.status === 'ошибка');

  if (errors.length > 0) {
    html += `<h4>Были ошибки:</h4><ul style="line-height:1.6;">`;
    errors.forEach(item => {
      html += `
        <li>
          <strong>${item.question}</strong><br>
          Твой ответ: «${item.student || 'пусто'}»<br>
          Правильно: ${item.correct}
        </li>
      `;
    });
    html += '</ul>';
  } else if (correct > 0) {
    html += '<p style="color:#10b981; font-weight:bold;">Ошибок нет! Отличная работа!</p>';
  }

  resultArea.innerHTML = html;
}

/**
 * Сохраняет данные в localStorage (офлайн-буфер)
 * @param {Object} data - данные работы
 */
function saveToBuffer(data) {
  try {
    const bufferString = localStorage.getItem('offlineBuffer') || '[]';
    const buffer = JSON.parse(bufferString);
    
    buffer.push({ 
      ...data, 
      savedAt: new Date().toISOString(),
      id: Date.now() // простой ID для идентификации
    });

    // Храним не больше 50 записей, чтобы не забить память
    if (buffer.length > 50) {
      buffer.shift();
    }

    localStorage.setItem('offlineBuffer', JSON.stringify(buffer));
    console.log('Работа сохранена в офлайн-буфер:', buffer.length, 'записей');
  } catch (e) {
    console.error('Не удалось сохранить в буфер:', e);
  }
}

async function submitWork() {
  clearInterval(timerInterval); // останавливаем таймер

  const blocks = document.querySelectorAll('.question-block');
  let correctCount = 0;
  const totalQuestions = blocks.length;
  const resultDetails = [];

  blocks.forEach(block => {
    const textarea = block.querySelector('textarea');
    const errorMsg = block.querySelector('.error-msg');
    
    // Читаем data-correct и парсим. Если пусто — пустой массив
    const correctAnswersRaw = textarea ? textarea.getAttribute('data-correct') : '';
    let correctAnswers = [];
    if (correctAnswersRaw) {
      try {
        correctAnswers = JSON.parse(correctAnswersRaw);
      } catch (e) {
        console.error('Ошибка парсинга data-correct:', e);
        correctAnswers = [];
      }
    }

    const answer = textarea?.value?.trim() || '';
    const normalizedAnswer = answer.toLowerCase().replace(/\s+/g, ' ').trim();

    // ИСПРАВЛЕННАЯ ПРОВЕРКА: проверяем тип перед toLowerCase
    const isCorrect = correctAnswers.some(correct => {
      if (typeof correct !== 'string') {
        return false; // Пропускаем не-строки (undefined, null, числа и т.д.)
      }
      const normalizedCorrect = correct.toLowerCase().replace(/\s+/g, ' ').trim();
      return normalizedAnswer === normalizedCorrect;
    });

    if (!isCorrect) {
      block.classList.add('has-error');
      if (errorMsg) errorMsg.style.display = 'block';
      resultDetails.push({
        question: textarea ? textarea.parentElement.querySelector('.question-text')?.textContent : 'Неизвестный вопрос',
        student: answer,
        correct: correctAnswers.filter(c => typeof c === 'string').join(' / ') || 'Нет правильного ответа',
        status: 'ошибка'
      });
    } else {
      block.classList.remove('has-error');
      if (errorMsg) errorMsg.style.display = 'none';
      correctCount++;
      resultDetails.push({
        question: textarea ? textarea.parentElement.querySelector('.question-text')?.textContent : 'Неизвестный вопрос',
        student: answer,
        correct: null,
        status: 'верно'
      });
    }
  });

  const studentName = (document.getElementById('student-name')?.value || 'Неизвестный').trim();
  const classLetter = (document.getElementById('class-letter')?.value || '').trim();
  const className = currentClass ? currentClass + ' класс' : 'Не указан';
  const scoreString = `${correctCount}/${totalQuestions}`;

  const payload = {
    student: studentName,
    'class': `${className} ${classLetter}`.trim(),
    topic: selectedTopic || 'Тема не выбрана',
    score: scoreString
  };

  const submitBtn = document.getElementById('submit-btn');
  if (submitBtn) {
    submitBtn.disabled = true;
    submitBtn.textContent = 'Отправка...';
  }

  const resultArea = document.getElementById('result-area');
  resultArea.style.display = 'block';
  resultArea.className = correctCount === totalQuestions ? 'result-success' : 'result-fail';

  renderLocalResult(correctCount, totalQuestions, resultDetails);

  try {
    const response = await fetch(GOOGLE_SCRIPT_URL, {
      method: 'POST',
      body: buildFormData(payload)
    });
    const result = await response.json();
    if (result.status === 'ok') {
      resultArea.innerHTML += `<p style="margin-top:10px; font-weight:bold;">Данные успешно сохранены в таблице учителя.</p>`;
    } else {
      throw new Error('Ошибка сервера');
    }
  } catch (err) {
    console.error('Не удалось отправить:', err);
    saveToBuffer(payload);
    resultArea.innerHTML += `
      <p style="margin-top:10px; color:#777; font-size:14px;">
        Нет интернета или ошибка сети. Работа сохранена в буфер и отправится при синхронизации.
      </p>
    `;
  } finally {
    if (submitBtn) {
      submitBtn.disabled = false;
      submitBtn.textContent = 'Сдать работу';
    }
    document.getElementById('back-to-cards-btn').style.display = 'inline-block';
  }
}

      async function syncOfflineBuffer() {
        const btn = document.getElementById('sync-btn');
        if (btn) {
          btn.disabled = true;
          btn.textContent = 'Синхронизация...';
        }

        const bufferStr = localStorage.getItem('offlineWorkBuffer');
        const buffer = bufferStr ? JSON.parse(bufferStr) : [];

        if (buffer.length === 0) {
          if (btn) {
            btn.disabled = false;
            btn.textContent = 'Синхронизировать';
          }
          return;
        }

        const successIds = [];

        for (const item of buffer) {
          try {
            const response = await fetch(GOOGLE_SCRIPT_URL, {
              method: 'POST',
              body: buildFormData(item.payload)
            });
            const result = await response.json();
            if (result.status === 'ok') {
              successIds.push(item.id);
            } else {
              console.warn('Сервер вернул ошибку:', result);
            }
          } catch (err) {
            console.warn('Не удалось отправить из буфера:', err);
            break;
          }
        }

        if (successIds.length > 0) {
          const remaining = buffer.filter(i => !successIds.includes(i.id));
          localStorage.setItem('offlineWorkBuffer', JSON.stringify(remaining));
        }

        if (btn) {
          btn.disabled = false;
          btn.textContent = 'Синхронизировать';
        }
      }

      function buildFormData(payload) {
        const fd = new FormData();
        fd.append('student', payload.student);
        fd.append('class', payload['class']);
        fd.append('topic', payload.topic);
        fd.append('score', payload.score);
        return fd;
      }

      window.addEventListener('DOMContentLoaded', () => {
        syncOfflineBuffer();
      });
    </script>
  </body>
</html>
